# PANW Customer VPN Configuration (Panorama / Terraform)
# Single source of truth for all Terraform-managed customer VPN configurations
# Terraform will create resources for customers listed here

# Global settings (applied to all customers)
global:
  template: "PANW-Terraform-Template"
  parent_device_group: "PANW-Terraform-Global"
  panw_network: "10.10.0.0/16"
  panw_network_object: "PANW-Terraform-net"
  to_zone: "trust"
  ike_profile: "PANW-Terraform-IKEv2-Standard"
  ipsec_profile: "PANW-Terraform-IPsec-Standard"
  local_interface: "ethernet1/1"
  virtual_router: "default"

# Customer configurations
# Only customers listed here will be deployed
# Removing a customer from this list will delete it (via Terraform destroy)
# Set enabled: false to disable without deleting
customers:
  - customer_name: "Customer-AB"
    device_group: "PANW-Terraform-Customer-AB"
    customer_network: "10.24.0.0/16"
    customer_network_object: "customer-AB-Net"
    peer_ip: "203.0.113.20"
    psk: "replace-with-real-psk"
    tunnel_number: 11
    zone_name: "Customer-AB-Zone"
    ike_gateway_name: "Customer-AB-IKE-GW"
    ipsec_tunnel_name: "Customer-AB-Tunnel"
    security_rule_name: "allow-customer-ab-to-panw-terraform"
    enabled: true

