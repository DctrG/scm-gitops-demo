# PANW Customer VPN Configuration (Panorama)
# This file defines all customers that need IPsec VPN connections

# Global settings (applied to all customers)
global:
  template: "PANW-Python-Template"
  parent_device_group: "PANW-Python-Global"
  customer_prefix: "PANW-Python-"
  panw_network: "10.10.0.0/16"
  panw_network_object: "PANW-Python-net"
  to_zone: "trust"
  ike_profile: "PANW-Python-IKEv2-Standard"
  ipsec_profile: "PANW-Python-IPsec-Standard"
  local_interface: "ethernet1/1"
  virtual_router: "default"

