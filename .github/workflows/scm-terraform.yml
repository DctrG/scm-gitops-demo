name: SCM VPN (Terraform)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scm/customers-terraform.yaml'
      - 'scm/terraform/**'
      - '.github/workflows/scm-terraform.yml'

  push:
    branches:
      - main
    paths:
      - 'scm/customers-terraform.yaml'
      - 'scm/terraform/**'
      - '.github/workflows/scm-terraform.yml'

  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  deploy:
    name: SCM Terraform VPN Automation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TF_PLUGIN_CACHE_DIR: /tmp/terraform-plugin-cache
      SCM_CLIENT_ID: ${{ secrets.PANW_CLIENT_ID }}
      SCM_CLIENT_SECRET: ${{ secrets.PANW_CLIENT_SECRET }}
      SCM_SCOPE: tsg_id:${{ secrets.PANW_TSG_ID }}
      SCM_TSG_ID: ${{ secrets.PANW_TSG_ID }}
      TF_VAR_panw_client_id: ${{ secrets.PANW_CLIENT_ID }}
      TF_VAR_panw_client_secret: ${{ secrets.PANW_CLIENT_SECRET }}
      TF_VAR_panw_tsg_id: ${{ secrets.PANW_TSG_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare Terraform customer file
        run: cp scm/customers-terraform.yaml scm/terraform/customers.yaml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-scm-${{ runner.os }}-${{ hashFiles('scm/terraform/versions.tf') }}
          restore-keys: |
            terraform-providers-scm-${{ runner.os }}-

      - name: Create Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Terraform fmt
        working-directory: scm/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: scm/terraform
        run: terraform init

      - name: Terraform validate
        working-directory: scm/terraform
        run: terraform validate

      - name: Terraform plan
        if: ${{ github.event_name == 'pull_request' || inputs.terraform_action == 'plan' }}
        working-directory: scm/terraform
        run: terraform plan

      - name: Terraform apply
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.terraform_action == 'apply') }}
        working-directory: scm/terraform
        run: terraform apply -auto-approve

      - name: Terraform destroy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.terraform_action == 'destroy' }}
        working-directory: scm/terraform
        run: terraform destroy -auto-approve
